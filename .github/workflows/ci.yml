name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run the test suite (no network is used)
        run: python -m pytest -q tests
      - name: Check that the benchmark results are current
        run: python scripts/run_benchmarks.py && git diff --exit-code benchmarks/RESULTS.md

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t green-metrics-studio .
      - name: Start the container and wait for the health check
        run: |
          docker run -d --name gms -p 7860:7860 green-metrics-studio
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7860/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs gms
          exit 1
