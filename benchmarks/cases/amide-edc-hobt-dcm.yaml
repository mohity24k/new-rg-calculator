id: amide-edc-hobt-dcm
title: Amide coupling with EDC hydrochloride and HOBt in dichloromethane
source:
  description: Procedure from a US patent, as recorded in the Open Reaction Database (CC BY-SA 4.0). Amounts are
    those stated in the procedure; workup amounts that the patent does not state are not included.
  patent: US08957205B2
  ord_reaction_id: ord-d830c2c8505d490790fc2559465ca432
  procedure_text: 105 g (550 mmol) of 1-ethyl-3-(3-dimethylaminopropyl)carbodiimide hydrochloride was added to a
    solution of 98.8 g (500 mmol) of 1-aminocyclohexanecarboxylic acid methyl ester hydrochloride, 84.2 g (550 mmol)
    of 1-hydroxybenzotriazole, 56.0 g (500 mmol) of 3-furancarboxylic acid and 152 g (1.5 mol) of triethylamine
    in 1000 ml of methylene chloride under ice-cooling. After the mixture was stirred at room temperature overnight,
    the reaction solution was concentrated under reduced pressure. Ethyl acetate was added to the residue and the
    mixture was successively washed with water, a 10% aqueous potassium hydrogensulfate solution, a saturated aqueous
    sodium hydrogencarbonate solution and saturated brine, followed by drying with anhydrous sodium sulfate. After
    the solvent was distilled off under reduced pressure, the obtained crystal was washed with diisopropyl ether
    to give 114 g (91%) of the title compound.
