id: redam-stab-dce
title: Reductive amination with sodium triacetoxyborohydride in 1,2-dichloroethane
source:
  description: Procedure from a US patent, as recorded in the Open Reaction Database (CC BY-SA 4.0). Amounts are
    those stated in the procedure; workup amounts that the patent does not state are not included.
  patent: US08927588B2
  ord_reaction_id: ord-5160cd059641445f8a5f14ce6e528db9
  procedure_text: 'The same operation as in Example (90c) was performed using tert-butyl 3-ethoxy-4-oxopiperidine-1-carboxylate
    obtained in Example (90b) (3.4 g, 14 mmol), benzylamine (1.65 g, 15.4 mmol), sodium (triacetoxy)borohydride
    (5.93 g, 28 mmol) and 1,2-dichloroethane (40 mL). The resulting residue was purified by silica gel column chromatography
    (elution solvent: hexane/ethyl acetate=4/1, 1/1, 1/3, 0/1) to obtain 4.06 g of the title compound as a colorless
    oily substance (87%).'
