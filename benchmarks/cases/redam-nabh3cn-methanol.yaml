id: redam-nabh3cn-methanol
title: Reductive amination with sodium cyanoborohydride in methanol
source:
  description: Procedure from a US patent, as recorded in the Open Reaction Database (CC BY-SA 4.0). Amounts are
    those stated in the procedure; workup amounts that the patent does not state are not included.
  patent: US07491713B2
  ord_reaction_id: ord-71934f819a8c472dab808ddb4f6eba3f
  procedure_text: Sodium cyanoborohydride (189 mg, 3.01 mmol) was added to a solution of 1-boc-4-piperidone (500
    mg, 2.51 mmol) and glycine ethyl ester hydrochloride (350 mg, 2.51 mmol) in methanol (12.5 mL). After 16 h,
    the mixture was quenched with saturated ammonium chloride solution, concentrated, and partitioned between dichloromethane
    and saturated sodium bicarbonate solution. The organic layer was washed with brine, dried over magnesium sulfate,
    filtered, and concentrated. Purification by silica gel chromatography [100% dichloromethane→95% dichloromethane/5%
    (10% ammonium hydroxide/methanol)] gave the title compound (600 mg).
