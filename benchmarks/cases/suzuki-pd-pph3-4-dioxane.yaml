id: suzuki-pd-pph3-4-dioxane
title: Suzuki-Miyaura coupling with Pd(PPh3)4 in 1,4-dioxane / water (microwave)
source:
  description: Procedure from a US patent, as recorded in the Open Reaction Database (CC BY-SA 4.0). Amounts are
    those stated in the procedure; workup amounts that the patent does not state are not included.
  patent: US08071588B2
  ord_reaction_id: ord-d414c5951c6746da9afb3166a1c67849
  procedure_text: To a solution of [(3-bromophenyl)methyl]amine hydrochloric salt (0.556 g, 2.5 mmol) in 1,4-dioxane
    (15 mL) and H2O (5 mL) was added {3-[(4-{[(1,1-dimethylethyl)-oxy]carbonyl}-1-piperazinyl)methyl]phenyl}boronic
    acid (1.041 g, 3.25 mmol), Pd(PPH3)4 (0.144 g, 0.125 mmol), and K2CO3 (1.382 g, 10 mmol). This mixture was heated
    in a microwave oven at about 150° C. for about 15 mins. The organic layer was separated, dried using a Glas-Col
    evaporator (Sigma-Aldrich), and was then purified by CombiFlash chromatograph to afford the title compound 0.798
    g (84%). LC-MS m/z 382 (M+H)+.
