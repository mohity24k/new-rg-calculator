id: redam-stab-dcm
title: Reductive amination with sodium triacetoxyborohydride in dichloromethane
source:
  description: Procedure from a US patent, as recorded in the Open Reaction Database (CC BY-SA 4.0). Amounts are
    those stated in the procedure; workup amounts that the patent does not state are not included.
  patent: US07517873B2
  ord_reaction_id: ord-593f7028fa3a491dba22058483a818fb
  procedure_text: To a solution of 11.5 g (0.075 mole) of beta-alanine ethyl ester hydrochloride and 6.3 g (0.073
    mole) of cyclopentanone in 200 mL of dichloromethane was added 6.5 g (0.082 mole) of sodium acetate and 22.5
    g (0.107 mole) of sodium triacetoxyborohydride. The mixture was stirred 24 hours and then quenched by the addition
    of 200 mL of saturated sodium bicarbonate solution. After 20 minutes, the organic layer was separated and the
    aqueous layer was extracted twice with dichloromethane. The combined dichloromethane layers were dried over
    anhydrous magnesium sulfate, filtered, and concentrated under reduced pressure to provide 12.0 g of 3-cyclopentylamino-propanoic
    acid ethyl ester, which was used without further purification.
