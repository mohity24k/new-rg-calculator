  - id: amide-additive-hobt
    kind: additive
    classes: [amide_coupling]
    target:
      name: "1-hydroxybenzotriazole (HOBt)"
      smiles: "On1nnc2ccccc21"
    problem: "Explosive properties when heated under confinement or under mechanical stimulus (Wehrstedt et al. 2005); anhydrous HOBt is subject to transport restrictions."
    replacements:
      - name: "ethyl cyano(hydroxyimino)acetate (Oxyma)"
        smiles: "CCOC(=O)C(=NO)C#N"
        amount: same_equiv
        adds: []
        removes: []
        scope: "Subiros-Funosas et al. 2009: in carbodiimide-mediated peptide couplings (manual and automated) Oxyma suppressed racemisation and gave coupling efficiency better than HOBt and at least comparable to HOAt. Calorimetry (DSC, ARC) indicated a lower explosion risk than the benzotriazoles."
