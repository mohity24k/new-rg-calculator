  - id: suzuki-solvent-dioxane
    kind: reaction_solvent
    classes: [suzuki_miyaura]
    target:
      name: "1,4-dioxane"
      smiles: "C1COCCO1"
    problem: "Carcinogen classification (H350 or H351, depending on the date of the safety data sheet). Forms peroxides. Fully miscible with water, so it ends up in the aqueous waste. Ranked hazardous in CHEM21."
    replacements:
      - name: "isopropanol/water (3:1 v/v)"
        smiles: "CC(C)O.O"
        amount: same_volume
        adds: []
        removes: []
        scope: "Sherwood 2020 ran three Pd-catalysed couplings of aryl bromides (4-bromotoluene, 4-bromophenylacetic acid, 4'-bromoacetophenone) with phenylboronic acid at 0.6 mmol in 3:1 organic solvent/water. Isopropanol performed well in all three cases. Isopropanol and water are ranked recommended in CHEM21."
        caveats: "Tested on simple aryl bromides only. Not covered: aryl chlorides, hindered partners, heteroaryl and other boronic acids prone to protodeboronation. Substrate-dependent: the paper's point is that this coupling is often insensitive to solvent, which makes a swap plausible but not certain. Catalyst and base may need re-optimising. Reflux temperature is about 80 degC, lower than dioxane, toluene or DMF."
        evidence: class_specific_study
        sources:
          - citation: "J. Sherwood, Beilstein J. Org. Chem., 2020, 16, 1001-1005"
            doi: "10.3762/bjoc.16.89"
            verified: yes
          - citation: "J. Sherwood, J. H. Clark, I. J. S. Fairlamb and J. M. Slattery, Green Chem., 2019, 21, 2164-2213"
            doi: "10.1039/C9GC00617F"
