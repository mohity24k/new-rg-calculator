  - id: amide-reagent-hatu
    kind: reagent
    classes: [amide_coupling]
    target:
      name: "HATU"
      smiles: "CN(C)C(=[N+](C)C)On1nnc2cccnc21.F[P-](F)(F)(F)(F)F"
    problem: "Flagged as potentially explosive in thermal stability screening (Sperry et al. 2018). Immune sensitiser; a case of anaphylaxis after repeated exposure is documented (McKnelly et al. 2020). High molecular weight (380) for one amide bond; leaves HOAt, tetramethylurea and hexafluorophosphate in the waste."
    replacements:
      - name: "propanephosphonic anhydride (T3P, supplied as a 50 wt% solution)"
        smiles: "CCCP1(=O)OP(=O)(CCC)OP(=O)(CCC)O1"
        amount: {equiv: 1.5}
        adds: [{name: "pyridine", smiles: "c1ccncc1", role: base, equiv: 3.0}]
        removes: []
        scope: "Dunetz et al. 2011: T3P with pyridine coupled epimerisation-prone acids with amines, including poorly nucleophilic anilines, with low epimerisation; applied to an intermediate for a glucokinase activator. MacMillan et al. 2013 included T3P in their solvent screen (ethyl acetate, 2-MeTHF, dimethyl carbonate)."
        caveats: "The T3P and pyridine amounts are starting points, not taken from one procedure; optimise them. T3P needs at least 2 equiv of base. If the procedure already has a tertiary amine base you can try keeping it, but the low-epimerisation result was obtained with pyridine. Pyridine is toxic and malodorous. In the MacMillan screen T3P gave poor conversion for alkyl acid + aryl amine. T3P comes as a solution; its carrier solvent adds to the solvent total. Phosphorus by-products go to the aqueous waste."
        evidence: class_specific_study
        sources:
          - citation: "J. R. Dunetz, Y. Xiang, A. Baldwin and J. Ringling, Org. Lett., 2011, 13, 5048-5051"
            doi: "10.1021/ol201875q"
            verified: yes
          - citation: "D. S. MacMillan, J. Murray, H. F. Sneddon, C. Jamieson and A. J. B. Watson, Green Chem., 2013, 15, 596-600"
            doi: "10.1039/C2GC36900A"
            verified: yes
          - citation: "J. R. Dunetz, J. Magano and G. A. Weisenburger, Org. Process Res. Dev., 2016, 20, 140-177"
            doi: "10.1021/op500305s"
            verified: no
          - citation: "J. B. Sperry et al., Org. Process Res. Dev., 2018, 22, 1262-1275"
            doi: "10.1021/acs.oprd.8b00193"
            verified: yes
          - citation: "K. J. McKnelly, W. Sokol and J. S. Nowick, J. Org. Chem., 2020, 85, 1764-1768"
            doi: "10.1021/acs.joc.9b03280"
            verified: yes
      - name: "EDC hydrochloride (EDC.HCl)"
        smiles: "CCN=C=NCCCN(C)C.Cl"
        amount: {equiv: 1.2}
        adds: []
        removes: []
        scope: "Carbodiimide whose urea by-product is water-soluble and is normally removed by an acidic aqueous wash. Covered in the Dunetz et al. 2016 review of coupling reagents used on large scale."
        caveats: "Usually less reactive than uronium or phosphonium reagents: hindered acids and poorly nucleophilic amines can be slow. Often needs an additive (for example Oxyma) to limit N-acylurea formation and epimerisation. The basic urea can be hard to wash out of polar or basic products. Loading is a starting point. EDC is a skin and eye irritant and a possible sensitiser."
        evidence: general_guide
        sources:
          - citation: "J. R. Dunetz, J. Magano and G. A. Weisenburger, Org. Process Res. Dev., 2016, 20, 140-177"
            doi: "10.1021/op500305s"
            verified: no
          - citation: "J. B. Sperry et al., Org. Process Res. Dev., 2018, 22, 1262-1275"
            doi: "10.1021/acs.oprd.8b00193"
            verified: yes
          - citation: "K. J. McKnelly, W. Sokol and J. S. Nowick, J. Org. Chem., 2020, 85, 1764-1768"
            doi: "10.1021/acs.joc.9b03280"
            verified: yes
      - name: "1,1'-carbonyldiimidazole (CDI)"
        smiles: "O=C(n1ccnc1)n1ccnc1"
        amount: {equiv: 1.1}
        adds: []
        removes: []
        scope: "Covered in the Dunetz et al. 2016 review of coupling reagents used on large scale. By-products are carbon dioxide and imidazole, which washes out with water."
        caveats: "Two-step addition: activate the acid first, wait until gas evolution stops, then add the amine. Releases about one equivalent of CO2; vent the vessel. Moisture-sensitive. Excess CDI reacts with the amine to give a urea. Acyl imidazoles react slowly with anilines and hindered amines. Epimerisation risk for alpha-chiral acids is not assessed here. Loading is a starting point."
        evidence: general_guide
        sources:
          - citation: "J. R. Dunetz, J. Magano and G. A. Weisenburger, Org. Process Res. Dev., 2016, 20, 140-177"
            doi: "10.1021/op500305s"
            verified: no
          - citation: "J. B. Sperry et al., Org. Process Res. Dev., 2018, 22, 1262-1275"
            doi: "10.1021/acs.oprd.8b00193"
            verified: yes
          - citation: "K. J. McKnelly, W. Sokol and J. S. Nowick, J. Org. Chem., 2020, 85, 1764-1768"
            doi: "10.1021/acs.joc.9b03280"
            verified: yes
      - name: "boric acid (catalytic)"
        role: catalyst   # 10 mol%: not a stoichiometric reagent
        smiles: "OB(O)O"
        amount: {mol_percent: 10.0}
        adds: []
