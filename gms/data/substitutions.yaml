    classes: [any]
    target:
      name: "dichloromethane"
      smiles: "ClCCl"
    problem: "Chromatography is one of the largest sources of chlorinated solvent waste in medicinal chemistry (Taygerly et al. 2012). Dichloromethane (typically as dichloromethane/methanol) is a suspected carcinogen (H351) and is ranked hazardous in CHEM21 (final ranking)."
    replacements:
      - name: "ethyl acetate/ethanol (3:1 v/v) in heptane"
        smiles: "CCOC(C)=O.CCO.CCCCCCC"
        amount: same_volume
        adds: []
        removes: []
        scope: "Taygerly et al. 2012: experimentally derived guide; mixtures of 3:1 ethyl acetate/ethanol in heptane, with or without acetic acid or ammonium hydroxide additive, covered neutral, acidic and basic test compounds that are usually run in dichloromethane/methanol. MacMillan et al. 2012 give a second, independent guide to dichloromethane-free eluents."
        caveats: "Not a like-for-like eluent strength: find the new ratio by TLC. Selectivity differs, so close-running impurities may separate better or worse. Ethyl acetate absorbs in the UV below about 255 nm and can hide weak chromophores on an automated system. Take additive levels from the paper. Compounds that are soluble only in dichloromethane may need dry loading."
