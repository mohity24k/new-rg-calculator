        scope: "Abdel-Magid et al. 1996: general for aldehydes and ketones with primary and secondary amines; gave higher yields and fewer side products than sodium cyanoborohydride in methanol in their comparisons. Acetic acid is used as catalyst with ketones and is usually not needed with aldehydes. McGonagle et al. 2013 used 1.2 equiv in ethyl acetate with aldehydes."
        caveats: "Not compatible with methanol, the usual solvent for cyanoborohydride: the solvent must change too. The original paper preferred 1,2-dichloroethane (also THF or acetonitrile); use ethyl acetate where the McGonagle study applies. Higher mass per hydride than cyanoborohydride. Moisture-sensitive. Dialkylation of primary amines with aldehydes can occur; the paper then used stepwise imine formation and sodium borohydride. Aromatic and hindered ketones can be slow. The loading is a starting point."
        evidence: class_specific_study
        sources:
