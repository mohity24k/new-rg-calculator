            doi: "10.1039/C5GC01008J"
            verified: yes
      - name: "2-methyltetrahydrofuran/water (3:1 v/v)"
        smiles: "CC1CCCO1.O"
        amount: same_volume
        adds: []
        removes: []
        scope: "Sherwood 2020 ran three Pd-catalysed couplings of aryl bromides (4-bromotoluene, 4-bromophenylacetic acid, 4'-bromoacetophenone) with phenylboronic acid at 0.6 mmol in 3:1 organic solvent/water. 2-MeTHF was one of six greener solvents tested there, and it is listed as a suggested replacement for Suzuki-Miyaura couplings in Jordan et al. 2022."
        caveats: "Tested on simple aryl bromides only. Not covered: aryl chlorides, hindered partners, heteroaryl and other boronic acids prone to protodeboronation. Substrate-dependent: the paper's point is that this coupling is often insensitive to solvent, which makes a swap plausible but not certain. Catalyst and base may need re-optimising. Two liquid phases: stir well; the inorganic base stays in the water layer. Boils at about 80 degC. Forms peroxides on storage. Ranked problematic, not recommended, in CHEM21."
        evidence: class_specific_study
        sources:
          - citation: "J. Sherwood, Beilstein J. Org. Chem., 2020, 16, 1001-1005"
            doi: "10.3762/bjoc.16.89"
            verified: yes
          - citation: "A. Jordan, C. G. J. Hall, L. R. Thorp and H. F. Sneddon, Chem. Rev., 2022, 122, 6749-6794"
            doi: "10.1021/acs.chemrev.1c00672"
            verified: yes
          - citation: "D. Prat, A. Wells, J. Hayler, H. Sneddon, C. R. McElroy, S. Abou-Shehada and P. J. Dunn, Green Chem., 2016, 18, 288-296"
            doi: "10.1039/C5GC01008J"
            verified: yes
      - name: "water containing 2 wt% TPGS-750-M surfactant (micellar)"
        precedent_search: false   # the dataset cannot tell micellar conditions from water as a co-solvent
        smiles: "O"
        amount: same_volume
        adds: []
        removes: []
        scope: "Lipshutz et al. 2011: Suzuki-Miyaura couplings at room temperature in water containing 2 wt% TPGS-750-M. The supplier protocol based on this work uses aryl bromides, Pd(dtbpf)Cl2 (about 2 mol%) and triethylamine (3 equiv) for 2-24 h."
        caveats: "This is a different procedure, not a solvent swap: catalyst and base change too. Isolation still needs an organic solvent for extraction, or a filtration. The surfactant goes to the aqueous waste. High-melting or very lipophilic solids can mix poorly. TPGS-750-M is a polymer mixture without a single SMILES; the SMILES given is water only, so the surfactant mass is not counted."
        evidence: class_specific_study
