# Greener substitution rules for Green Metrics Studio.
# Curated 2026-11-12. Every SMILES was parsed with RDKit.
# verified: yes = bibliographic details AND the content the rule relies on were confirmed during curation
#   from web search results (publisher, repository or indexing pages). Full texts could not be opened
#   (publisher sites were blocked in the curation environment), so no entry was checked against a full paper.
# verified: no  = the reference exists (title/journal/year/DOI confirmed) but the specific content the rule
#   relies on could not be confirmed online; treat the rule as lower confidence until someone reads the paper.
# Amounts given as {equiv: ...} or {mol_percent: ...} are starting points, not literature-exact loadings.
schema_version: 1
rules:
  - id: amide-solvent-dmf
    kind: reaction_solvent
    classes: [amide_coupling]
    target:
      name: "N,N-dimethylformamide"
      smiles: "CN(C)C=O"
    problem: "Reprotoxic (H360D). Ranked hazardous in CHEM21. High boiling point (153 degC) makes removal slow and energy-intensive; usually removed by repeated aqueous washes."
    replacements:
      - name: "ethyl acetate"
        smiles: "CCOC(C)=O"
        amount: same_volume
        adds: []
        removes: []
        scope: "MacMillan et al. 2013 screened COMU, DIC/HOBt, HATU, PyBOP and T3P on four acid/amine pairings (aryl and alkyl acids with aryl and alkyl amines) and judged dimethyl carbonate, ethyl acetate and 2-MeTHF practical replacements for dichloromethane and DMF. A wider substrate set was then run with COMU in these solvents."
        caveats: "Conversion depended on the reagent and the acid/amine pairing; T3P was poor for alkyl acid + aryl amine in that screen. Check that acid, amine (or amine salt) and base dissolve; polar or zwitterionic substrates may not. One COMU example needed about 24 h in ethyl acetate instead of about 4 h. Ethyl acetate is ranked recommended in CHEM21."
        evidence: class_specific_study
        sources:
          - citation: "D. S. MacMillan, J. Murray, H. F. Sneddon, C. Jamieson and A. J. B. Watson, Green Chem., 2013, 15, 596-600"
            doi: "10.1039/C2GC36900A"
            verified: yes
          - citation: "A. Jordan, C. G. J. Hall, L. R. Thorp and H. F. Sneddon, Chem. Rev., 2022, 122, 6749-6794"
            doi: "10.1021/acs.chemrev.1c00672"
            verified: yes
          - citation: "D. Prat, A. Wells, J. Hayler, H. Sneddon, C. R. McElroy, S. Abou-Shehada and P. J. Dunn, Green Chem., 2016, 18, 288-296"
            doi: "10.1039/C5GC01008J"
            verified: yes
      - name: "2-methyltetrahydrofuran"
        smiles: "CC1CCCO1"
        amount: same_volume
        adds: []
        removes: []
        scope: "MacMillan et al. 2013 screened COMU, DIC/HOBt, HATU, PyBOP and T3P on four acid/amine pairings (aryl and alkyl acids with aryl and alkyl amines) and judged dimethyl carbonate, ethyl acetate and 2-MeTHF practical replacements for dichloromethane and DMF. A wider substrate set was then run with COMU in these solvents."
        caveats: "Conversion depended on the reagent and the acid/amine pairing; T3P was poor for alkyl acid + aryl amine in that screen. Check that acid, amine (or amine salt) and base dissolve; polar or zwitterionic substrates may not. 2-MeTHF forms peroxides on storage and costs more. It is ranked problematic, not recommended, in CHEM21."
        evidence: class_specific_study
        sources:
          - citation: "D. S. MacMillan, J. Murray, H. F. Sneddon, C. Jamieson and A. J. B. Watson, Green Chem., 2013, 15, 596-600"
            doi: "10.1039/C2GC36900A"
            verified: yes
          - citation: "A. Jordan, C. G. J. Hall, L. R. Thorp and H. F. Sneddon, Chem. Rev., 2022, 122, 6749-6794"
            doi: "10.1021/acs.chemrev.1c00672"
            verified: yes
          - citation: "D. Prat, A. Wells, J. Hayler, H. Sneddon, C. R. McElroy, S. Abou-Shehada and P. J. Dunn, Green Chem., 2016, 18, 288-296"
            doi: "10.1039/C5GC01008J"
            verified: yes
      - name: "dimethyl carbonate"
        smiles: "COC(=O)OC"
        amount: same_volume
        adds: []
        removes: []
        scope: "MacMillan et al. 2013 screened COMU, DIC/HOBt, HATU, PyBOP and T3P on four acid/amine pairings (aryl and alkyl acids with aryl and alkyl amines) and judged dimethyl carbonate, ethyl acetate and 2-MeTHF practical replacements for dichloromethane and DMF. A wider substrate set was then run with COMU in these solvents."
        caveats: "Conversion depended on the reagent and the acid/amine pairing; T3P was poor for alkyl acid + aryl amine in that screen. Check that acid, amine (or amine salt) and base dissolve; polar or zwitterionic substrates may not. Keep to ambient temperature: dimethyl carbonate is an electrophile and can react with amines when heated with base. Melting point is about 4 degC, so it can freeze in a cold bath."
        evidence: class_specific_study
        sources:
          - citation: "D. S. MacMillan, J. Murray, H. F. Sneddon, C. Jamieson and A. J. B. Watson, Green Chem., 2013, 15, 596-600"
            doi: "10.1039/C2GC36900A"
            verified: yes
          - citation: "A. Jordan, C. G. J. Hall, L. R. Thorp and H. F. Sneddon, Chem. Rev., 2022, 122, 6749-6794"
            doi: "10.1021/acs.chemrev.1c00672"
            verified: yes

